apiVersion: v1
kind: Secret
metadata:
  name: ccg-secrets
  namespace: cloud-cost-guardian
type: Opaque
stringData:
  POSTGRES_USER: "ccg_user"
  POSTGRES_PASSWORD: "ccg_password"
  POSTGRES_DB: "cloud_cost_guardian"
  DATABASE_URL: "postgresql://ccg_user:ccg_password@ccg-postgres:5432/cloud_cost_guardian"

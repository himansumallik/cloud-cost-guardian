apiVersion: apps/v1
kind: Deployment
metadata:
  name: ccg-web
  namespace: cloud-cost-guardian
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ccg-web
  template:
    metadata:
      labels:
        app: ccg-web
    spec:
      containers:
        - name: web
          image: ghcr.io/cloud-cost-guardian/web:latest
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: ccg-web-svc
  namespace: cloud-cost-guardian
spec:
  type: NodePort
  selector:
    app: ccg-web
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080

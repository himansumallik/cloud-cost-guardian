server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://api:3000/api/;
        proxy_set_header Host $host;
    }

    location /health {
        proxy_pass http://api:3000/health;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
